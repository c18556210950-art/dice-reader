<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>骰盘 · 本地标注台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121d22;color:#e6eceb;font:16px system-ui}header,main{max-width:1440px;margin:auto;padding:20px}h1{font-size:27px;margin:0 0 8px}p{color:#adc1c2;line-height:1.6}button,input,select{font:inherit;padding:9px;border:1px solid #476268;border-radius:7px;background:#20363c;color:#fff}button{cursor:pointer}button:hover{background:#37525b}input[type=number]{width:85px}input[type=checkbox]{width:18px;height:18px}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.workspace{display:grid;grid-template-columns:minmax(300px,1fr) 400px;gap:20px}.picture{background:#071014;border-radius:10px;overflow:hidden;position:relative;align-self:start}canvas{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}.dice{background:#1b2c32;padding:12px;margin-bottom:10px;border-radius:9px}.dice strong{color:#f5cb79}.line{display:flex;align-items:center;gap:9px;margin:8px 0}.muted{color:#a1b4b6;font-size:14px}.primary{background:#427266}#message{min-height:25px;color:#f5cb79}#position{font-variant-numeric:tabular-nums}@media(max-width:900px){.workspace{grid-template-columns:1fr}}button:disabled{opacity:.4;cursor:default}
</style>
<header><h1>骰盘 · 本地标注台</h1><p>框住整颗骰子 → 选择种类 → 填写实际读数。图片只保存在这台电脑。原网页服务保持不变。</p>
<nav><input id="group" placeholder="拍摄批次：手机A/日期/套装1" size="30"><button id="upload">导入照片</button><input id="files" type="file" accept="image/*" multiple hidden><select id="filter"><option value="all">全部照片</option><option value="pending">尚未人工复核</option><option value="own">我的照片</option></select></nav>
<p class="muted">D4 按实体骰子的顶读/底读规则标注；D10 填印刷值 0–9，百分骰选 d00 填 0、10…90。看不清时勾选“无法判读”，不要猜。框出所有骰子再保存，空照片也可保存。</p>
<nav><button id="prev">上一张</button><span id="position">正在读取…</span><button id="next">下一张</button><button id="save" class="primary">保存标注</button><span id="status" class="muted"></span></nav><div id="message" role="status"></div></header>
<main class="workspace"><div class="picture"><canvas id="canvas" width="1000" height="700"></canvas></div><aside><h2 style="margin-top:0">骰子标签</h2><div id="rows"></div><p class="muted">在左侧图片上拖动画框。框的位置不对时，删除后重新框选。人工确认勾选后，点数才会进入分类器训练；未确认点数只用于训练检测框。</p></aside></main>
<script>
const $=id=>document.getElementById(id), kinds=['d4','d6','d8','d10','d12','d20','d00'];let all=[],list=[],idx=0,current=null,dice=[],image=new Image(),dirty=false,start=null,selected=0;
function message(t){$('message').textContent=t}async function api(url,options){let r=await fetch(url,options);if(!r.ok){let j=await r.json();throw Error(j.detail||r.status)}return r.json()}
function filtered(){list=all.filter(r=>$('filter').value==='pending'?!r.human_reviewed:$('filter').value==='own'?r.source==='personal':true);idx=Math.min(idx,Math.max(0,list.length-1))}
function draw(preview){let c=$('canvas'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);if(current)ctx.drawImage(image,0,0,c.width,c.height);dice.forEach((d,i)=>{let b=d.box;ctx.strokeStyle=i===selected?'#f5cb79':'#58d9bb';ctx.lineWidth=3;ctx.strokeRect(b.x*c.width,b.y*c.height,b.w*c.width,b.h*c.height);ctx.fillStyle='#061b19';ctx.fillRect(b.x*c.width,b.y*c.height,100,27);ctx.fillStyle='#fff';ctx.font='18px system-ui';ctx.fillText(`${i+1} ${d.type}:${d.value??'?'}`,b.x*c.width+4,b.y*c.height+20)});if(preview){ctx.strokeStyle='#fff';ctx.strokeRect(preview.x*c.width,preview.y*c.height,preview.w*c.width,preview.h*c.height)}}
function rows(){let root=$('rows');root.replaceChildren();dice.forEach((d,i)=>{let div=document.createElement('div');div.className='dice';let strong=document.createElement('strong');strong.textContent=`骰子 ${i+1}`;div.append(strong);let line=document.createElement('div');line.className='line';let type=document.createElement('select');kinds.forEach(k=>{let o=new Option(k,k);type.add(o)});type.value=d.type;type.onchange=()=>{d.type=type.value;d.value=null;d.value_trusted=false;dirty=true;rows();draw()};let value=document.createElement('input');value.type='number';value.placeholder='点数';value.value=d.value??'';value.min=0;value.max=d.type==='d00'?90:Number(d.type.slice(1));value.step=d.type==='d00'?10:1;value.oninput=()=>{d.value=value.value===''?null:Number(value.value);dirty=true;draw()};let del=document.createElement('button');del.textContent='删除';del.onclick=()=>{dice.splice(i,1);dirty=true;rows();draw()};line.append(type,value,del);div.append(line);for(let [key,text] of [['value_trusted','人工确认点数'],['unreadable','无法判读']]){let label=document.createElement('label');label.className='line';let cb=document.createElement('input');cb.type='checkbox';cb.checked=!!d[key];cb.onchange=()=>{d[key]=cb.checked;if(key==='unreadable'&&cb.checked){d.value_trusted=false;d.value=null;rows()}if(key==='value_trusted'&&cb.checked){d.unreadable=false;rows()}dirty=true};label.append(cb,document.createTextNode(text));div.append(label)}div.onclick=()=>{selected=i;draw()};root.append(div)})}
function show(){current=list[idx]||null;dice=structuredClone(current?.dice||[]);dirty=false;start=null;$('position').textContent=list.length?`${idx+1} / ${list.length}`:'暂无照片，请导入';$('status').textContent=current?`${current.human_reviewed?'已人工复核':'待人工复核'} · ${current.group}`:'';$('prev').disabled=idx===0;$('next').disabled=idx>=list.length-1;$('save').disabled=!current;rows();if(current){image.onload=()=>{let c=$('canvas');let ratio=Math.min(1,1400/image.naturalWidth);c.width=Math.round(image.naturalWidth*ratio);c.height=Math.round(image.naturalHeight*ratio);draw()};image.src='/api/image/'+encodeURIComponent(current.id)}else draw()}
async function refresh(){all=await api('/api/records');filtered();show()}
function canLeave(){return !dirty||confirm('尚未保存，确定放弃当前修改？')}
$('prev').onclick=()=>{if(idx&&canLeave()){idx--;show()}};$('next').onclick=()=>{if(idx<list.length-1&&canLeave()){idx++;show()}};$('filter').onchange=()=>{if(canLeave()){idx=0;filtered();show()}};
$('save').onclick=async()=>{try{await api('/api/records/'+encodeURIComponent(current.id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dice})});Object.assign(current,{dice:structuredClone(dice),human_reviewed:true});dirty=false;$('status').textContent='已人工复核 · '+current.group;message('已保存，可继续下一张。')}catch(e){message(e.message)}};
$('upload').onclick=()=>{if(!$('group').value.trim()){message('先填写拍摄批次，避免同一组照片分散进训练和测试集。');return}$('files').click()};$('files').onchange=async()=>{if(!canLeave())return;try{let files=[...$('files').files];for(let [i,f] of files.entries()){message(`正在导入 ${i+1}/${files.length}`);await api('/api/upload?group='+encodeURIComponent($('group').value),{method:'POST',body:f})}$('filter').value='own';await refresh();idx=Math.max(0,list.length-1);show();message('导入完成，请框选骰子。')}catch(e){message(e.message)}$('files').value=''};
let canvas=$('canvas');function point(e){let b=canvas.getBoundingClientRect();return{x:Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),y:Math.min(1,Math.max(0,(e.clientY-b.top)/b.height))}}function box(p){return{x:Math.min(start.x,p.x),y:Math.min(start.y,p.y),w:Math.abs(p.x-start.x),h:Math.abs(p.y-start.y)}}canvas.onpointerdown=e=>{if(!current)return;start=point(e);canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(start)draw(box(point(e)))};canvas.onpointerup=e=>{if(!start)return;let b=box(point(e));start=null;if(b.w>.005&&b.h>.005){dice.push({type:'d20',value:null,box:b,value_trusted:false,unreadable:false});selected=dice.length-1;dirty=true;rows()}draw()};canvas.onpointercancel=()=>{start=null;draw()};window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};refresh().catch(e=>message(e.message));
</script></html>
